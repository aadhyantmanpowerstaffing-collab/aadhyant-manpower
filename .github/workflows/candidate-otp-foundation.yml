name: Candidate OTP Foundation Tests
on:
  pull_request:
    paths:
      - 'assets/js/candidate-otp.js'
      - 'candidate/register/index.html'
      - 'config.js'
      - 'supabase/functions/candidate-auth-whatsapp-hook/**'
      - 'supabase/migrations/20261105*'
      - 'supabase/tests/20261105_candidate_otp_security_test.sql'
      - 'scripts/build-*-artifact.js'
      - 'tests/staging-artifact.test.js'
      - 'tests/production-artifact.test.js'
      - 'package.json'
      - '.gitignore'
      - 'docs/otp/CANDIDATE_WHATSAPP_OTP_READINESS.md'
      - 'tests/candidate-whatsapp-otp-foundation.test.js'
      - '.github/workflows/candidate-otp-foundation.yml'
  workflow_dispatch:
jobs:
  candidate-otp-static-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/js/candidate-otp.js
      - run: node --check tests/candidate-whatsapp-otp-foundation.test.js
      - run: node --test tests/candidate-whatsapp-otp-foundation.test.js tests/staging-artifact.test.js tests/production-artifact.test.js
      - run: npm run build
