name: Automatic registered-candidate job alerts

on:
  schedule:
    - cron: '2-57/5 * * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: whatsapp-approved-production-queue
  cancel-in-progress: false

jobs:
  bounded-worker:
    # Repository enable gate controls scheduling; environment enable gate controls the runner.
    # Keep database alerts OFF during the initial credential/heartbeat verification.
    if: >-
      github.repository == 'aadhyantmanpowerstaffing-collab/aadhyant-manpower' &&
      github.ref == 'refs/heads/main' && github.event_name == 'schedule' &&
      vars.WHATSAPP_REGISTERED_ALERTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: whatsapp-production
    steps:
      - name: Require reviewed immutable source
        env:
          APPROVED_SHA: ${{ vars.WHATSAPP_REGISTERED_ALERTS_APPROVED_SHA }}
        run: |
          [[ "$APPROVED_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
      - name: Check out reviewed scheduler source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ vars.WHATSAPP_REGISTERED_ALERTS_APPROVED_SHA }}
          persist-credentials: false
      - name: Record checked-out source
        run: echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Process at most ten canonical automatic alerts
        env:
          WHATSAPP_WORKER_SECRET: ${{ secrets.WHATSAPP_WORKER_SECRET }}
          WHATSAPP_REGISTERED_ALERTS_ENABLED: ${{ vars.WHATSAPP_REGISTERED_ALERTS_ENABLED }}
          WHATSAPP_REGISTERED_ALERTS_APPROVED_SHA: ${{ vars.WHATSAPP_REGISTERED_ALERTS_APPROVED_SHA }}
        run: node scripts/whatsapp/run-registered-alerts.cjs
