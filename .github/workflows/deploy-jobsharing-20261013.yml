name: Deploy approved job-sharing release once

on:
  push:
    branches: [web-platform-development]
    paths: [.github/workflows/deploy-jobsharing-20261013.yml]

permissions:
  contents: read

concurrency:
  group: production-pages
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'aadhyantmanpowerstaffing-collab/aadhyant-manpower' &&
      github.ref == 'refs/heads/web-platform-development' &&
      github.event_name == 'push' && github.run_attempt == 1 &&
      github.event.head_commit.message == 'Deploy approved subscription design a39de54'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enforce the approved one-hour publication window
        shell: bash
        run: |
          current=$(date -u +%s)
          start=$(date -u -d '2026-10-13T05:20:50Z' +%s)
          end=$(date -u -d '2026-10-13T06:20:50Z' +%s)
          (( current >= start && current < end )) || exit 1
      - name: Check out the exact reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: a39de54518a98d46bc9073556abb141f5beb5508
          persist-credentials: false
      - name: Build and validate the allowlisted artifact
        run: |
          node scripts/build-production-artifact.js
          npm test
          node scripts/build-production-artifact.js --verify
      - name: Upload only the approved site artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: dist
      - name: Deploy through the existing Pages environment
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
