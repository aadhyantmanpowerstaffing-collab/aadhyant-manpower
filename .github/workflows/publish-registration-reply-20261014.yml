name: Publish authorized registration reply once
on:
  push:
    branches: [web-platform-development]
    paths: [.github/workflows/publish-registration-reply-20261014.yml]
permissions:
  contents: read
concurrency:
  group: production-pages
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'aadhyantmanpowerstaffing-collab/aadhyant-manpower' &&
      github.ref == 'refs/heads/web-platform-development' &&
      github.event_name == 'push' && github.run_attempt == 1 &&
      github.event.head_commit.message == 'Publish authorized registration reply bf0ace8'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enforce this publication window
        run: |
          current=$(date -u +%s)
          start=$(date -u -d '2026-10-14T08:57:00Z' +%s)
          end=$(date -u -d '2026-10-14T09:57:00Z' +%s)
          (( current >= start && current < end )) || exit 1
      - name: Check out reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: bf0ace8b51a409ec9debdfc58dd248560357bd1d
          persist-credentials: false
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Build and verify
        run: |
          node scripts/build-production-artifact.js
          npm test
          node scripts/build-production-artifact.js --verify
          test "$(cut -d ' ' -f1 dist/artifact-digest.sha256)" = "7266473e52d3bf9d2cf6e388cc4c0ae53a0fe71e4ecc95c6ae572b776a3a88ed"
      - name: Upload approved artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: dist
      - name: Publish approved artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
