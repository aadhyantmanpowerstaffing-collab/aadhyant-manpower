name: Build queued recruitment Reels
on:
  schedule:
    - cron: '4-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recruitment-reels-production
  cancel-in-progress: false
jobs:
  render:
    if: github.repository == 'aadhyantmanpowerstaffing-collab/aadhyant-manpower' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out reviewed immutable renderer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 0df9bb4433dd6377328b344737129dc00299cefc
          persist-credentials: false
      - name: Claim at most one current public job
        run: python3 tools/reel-studio/cloud_worker.py claim "$RUNNER_TEMP/reel-job.json"
      - name: Install voice and rendering dependencies only when needed
        run: |
          if [ -f "$RUNNER_TEMP/reel-job.json" ]; then
            python3 -m pip install --disable-pip-version-check -r tools/reel-studio/requirements.txt
            if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null || ! command -v espeak-ng >/dev/null; then
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
            fi
          fi
      - name: Render and return the private MP4
        run: |
          if [ -f "$RUNNER_TEMP/reel-job.json" ]; then
            python3 tools/reel-studio/cloud_worker.py render "$RUNNER_TEMP/reel-job.json"
          fi
      - name: Remove temporary job claim
        if: always()
        run: python3 tools/reel-studio/cloud_worker.py fail "$RUNNER_TEMP/reel-job.json"
