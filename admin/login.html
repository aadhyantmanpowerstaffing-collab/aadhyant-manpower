<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23102447'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Arial' font-size='40' font-weight='700' fill='white'%3EA%3C/text%3E%3C/svg%3E">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login | Aadhyant Manpower &amp; Staffing</title>
  <link rel="stylesheet" href="admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="../config.js" defer></script>
  <script src="../supabase-client.js" defer></script>
  <script src="admin.js" defer></script>
</head>
<body class="admin-login-page" data-admin-page="login">
  <main class="login-shell">
    <a class="admin-brand" href="../index.html" aria-label="Return to Aadhyant Manpower & Staffing website">
      <span aria-hidden="true">A</span>
      <strong>AADHYANT <small>ADMIN</small></strong>
    </a>
    <section class="login-card" aria-labelledby="login-title">
      <p class="admin-eyebrow">Secure administration</p>
      <h1 id="login-title">Admin Login</h1>
      <p>Sign in with an approved Supabase Auth account.</p>
      <div class="admin-message" data-auth-message role="status" aria-live="polite"></div>
      <form data-login-form novalidate>
        <div class="admin-field">
          <label for="admin-email">Email address</label>
          <input id="admin-email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="admin-field">
          <label for="admin-password">Password</label>
          <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="admin-button admin-button-primary" type="submit">Sign In</button>
      </form>
      <p class="login-help">Access is limited to approved administrator accounts. Public sign-up is not available.</p>
    </section>
  </main>
</body>
</html>
