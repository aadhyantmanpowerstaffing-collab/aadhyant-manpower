<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23102447'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Arial' font-size='40' font-weight='700' fill='white'%3EA%3C/text%3E%3C/svg%3E">
  <meta name="robots" content="noindex, nofollow">
  <title>Company Login | Aadhyant Manpower &amp; Staffing</title>
  <link rel="stylesheet" href="company.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="../config.js" defer></script>
  <script src="../supabase-client.js" defer></script>
  <script src="company.js" defer></script>
</head>
<body class="auth-page" data-company-page="login">
  <main class="auth-shell">
    <a class="company-brand light-brand" href="../index.html" aria-label="Aadhyant Manpower and Staffing home"><span aria-hidden="true">A</span><strong>AADHYANT <small>COMPANY PORTAL</small></strong></a>
    <section class="auth-card" aria-labelledby="company-login-title">
      <p class="eyebrow">Secure company access</p>
      <h1 id="company-login-title">Company Login</h1>
      <p>Sign in to check your approval status and access your company workspace.</p>
      <div class="company-message" data-page-message role="status" aria-live="polite"></div>
      <form data-login-form novalidate>
        <div class="field"><label for="company-email">Work email</label><input id="company-email" name="email" type="email" autocomplete="username" required><span class="field-error" data-error-for="email"></span></div>
        <div class="field"><label for="company-password">Password</label><input id="company-password" name="password" type="password" autocomplete="current-password" required><span class="field-error" data-error-for="password"></span></div>
        <button class="company-button company-button-primary" type="submit">Sign In</button>
      </form>
      <button class="reset-link" type="button" data-reset-password>Forgot your password?</button>
      <p class="auth-alternate">New to the Company Portal? <a href="register.html">Register your company</a></p>
      <p class="auth-help">Account access is activated only after review by Aadhyant.</p>
    </section>
  </main>
</body>
</html>
