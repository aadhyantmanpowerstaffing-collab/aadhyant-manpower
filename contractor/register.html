<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Staffing Partner Registration | Aadhyant</title>
  <link rel="stylesheet" href="contractor.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4" integrity="sha384-yiVMs0R/Jyz7OhoXa/DsEMUSBLjEhr/QJta2ONO+zB6I8/GmNg/7AUFrZmAJV7KV" crossorigin="anonymous" defer></script>
  <script src="../config.js" defer></script>
  <script src="../supabase-client.js" defer></script>
  <script src="../assets/js/legal-consent.js" defer></script>
  <script src="../assets/js/registration-options.js" defer></script>
  <script src="contractor.js" defer></script>
</head>
<body data-contractor-page="register">
  <header class="portal-header"><a class="brand" href="../index.html"><span>A</span><strong>AADHYANT<small>CONTRACTOR PORTAL</small></strong></a><a href="login.html">Contractor Portal</a></header>
  <main class="register-layout">
    <section><p class="eyebrow">Contractor / Staffing Partner onboarding</p><h1>Register as a Staffing Partner</h1><p>Register your agency for review and controlled manpower requirement assignments.</p></section>
    <section class="card">
      <div class="message" data-page-message role="status" aria-live="polite"></div>
      <form data-register-form novalidate>
        <fieldset><legend>Account</legend><div class="grid">
          <label>Work email *<input name="email" type="email" autocomplete="email" maxlength="254" required><small data-error="email"></small></label>
          <label>Password *<input name="password" type="password" autocomplete="new-password" minlength="8" required><small data-error="password"></small></label>
          <label>Confirm password *<input name="confirmPassword" type="password" autocomplete="new-password" required><small data-error="confirmPassword"></small></label>
        </div></fieldset>
        <fieldset><legend>Agency details</legend><div class="grid">
          <label>Agency / Business name *<input name="agencyName" autocomplete="organization" maxlength="240" required><small data-error="agencyName"></small></label>
          <label>Contact person *<input name="contactPerson" autocomplete="name" maxlength="160" required><small data-error="contactPerson"></small></label>
          <label>Mobile *<input name="mobile" inputmode="numeric" autocomplete="tel" pattern="[6-9][0-9]{9}" maxlength="10" required><small data-error="mobile"></small></label>
          <label>GSTIN <span>(optional)</span><input name="gstin" maxlength="15" autocapitalize="characters"><small data-error="gstin"></small></label>
          <label>Website <span>(optional)</span><input name="website" type="url" maxlength="300"></label>
          <label>Workforce capacity <span>(optional)</span><input name="workforceCapacity" type="number" min="0" max="1000000"></label>
          <label>State *<select name="state" data-option-set="states" data-placeholder="Select state" required></select><small data-error="state"></small></label>
          <label>District <span>(optional)</span><input name="district" autocomplete="address-level2" maxlength="160"><small>Enter the official district name.</small></label>
          <label>City *<input name="city" autocomplete="address-level3" maxlength="160" required><small data-error="city"></small></label>
          <label>Pincode <span>(optional)</span><input name="pincode" inputmode="numeric" autocomplete="postal-code" pattern="[0-9]{6}" maxlength="6"><small data-error="pincode"></small></label>
          <label class="wide">Address <span>(optional)</span><textarea name="address" rows="3" maxlength="600" autocomplete="street-address"></textarea></label>
          <label class="wide">Service areas <span>(comma separated, optional)</span><input name="serviceAreas" maxlength="600"></label>
          <label class="wide">Trades / manpower categories <span>(comma separated, optional)</span><input name="categories" maxlength="600"></label>
        </div></fieldset>
        <label class="consent"><input name="consent" type="checkbox" required><span>I acknowledge that Aadhyant may review these details before activating this staffing partner account.</span></label>
        <small data-error="consent"></small>
        <button class="button primary" type="submit">Create Staffing Partner Account</button>
      </form>
    </section>
  </main>
</body>
</html>
