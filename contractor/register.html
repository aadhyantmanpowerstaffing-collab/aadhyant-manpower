<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Staffing Partner Registration | Aadhyant</title><link rel="stylesheet" href="contractor.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="../config.js" defer></script><script src="../supabase-client.js" defer></script><script src="contractor.js" defer></script></head>
<body data-contractor-page="register"><header class="portal-header"><a class="brand" href="../index.html"><span>A</span><strong>AADHYANT<small>STAFFING PARTNER</small></strong></a><a href="login.html">Partner Login</a></header><main class="register-layout"><section><p class="eyebrow">Partner with Aadhyant</p><h1>Staffing Partner Registration</h1><p>Register your agency for review and controlled manpower requirement assignments.</p></section><section class="card"><div class="message" data-page-message role="status" aria-live="polite"></div><form data-register-form novalidate><fieldset><legend>Account</legend><div class="grid"><label>Work email *<input name="email" type="email" required><small data-error="email"></small></label><label>Password *<input name="password" type="password" required><small data-error="password"></small></label><label>Confirm password *<input name="confirmPassword" type="password" required><small data-error="confirmPassword"></small></label></div></fieldset><fieldset><legend>Agency details</legend><div class="grid"><label>Agency legal name *<input name="agencyName" maxlength="240" required><small data-error="agencyName"></small></label><label>Contact person *<input name="contactPerson" maxlength="160" required><small data-error="contactPerson"></small></label><label>Mobile *<input name="mobile" inputmode="numeric" maxlength="10" required><small data-error="mobile"></small></label><label>GSTIN<input name="gstin" maxlength="15"><small data-error="gstin"></small></label><label>Labour licence / CLRA<input name="labourLicense" maxlength="120"></label><label>EPFO code<input name="epfoCode" maxlength="120"></label><label>ESIC code<input name="esicCode" maxlength="120"></label><label>Website<input name="website" type="url" maxlength="300"></label><label>Workforce capacity<input name="workforceCapacity" type="number" min="0" max="1000000"></label><label>City *<input name="city" maxlength="160" required><small data-error="city"></small></label><label>District<input name="district" maxlength="160"></label><label>State *<input name="state" maxlength="160" required><small data-error="state"></small></label><label>Pincode<input name="pincode" inputmode="numeric" maxlength="6"><small data-error="pincode"></small></label><label class="wide">Address<textarea name="address" rows="3" maxlength="600"></textarea></label><label class="wide">Service areas <span>(comma separated)</span><input name="serviceAreas" maxlength="600"></label><label class="wide">Trades / manpower categories <span>(comma separated)</span><input name="categories" maxlength="600"></label><label class="wide">Notes<textarea name="notes" rows="3" maxlength="1500"></textarea></label></div></fieldset><label class="consent"><input name="consent" type="checkbox" required><span>I acknowledge that Aadhyant may review these details before activating this staffing partner account.</span></label><small data-error="consent"></small><button class="button primary" type="submit">Create Partner Account</button></form></section></main></body></html>
