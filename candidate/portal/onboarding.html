<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Candidate Profile Setup | Aadhyant</title><link rel="stylesheet" href="candidate.css"></head><body data-candidate-page="onboarding"><main class="auth-page"><section class="auth-card"><p class="eyebrow">Required profile</p><h1>Complete Candidate Profile</h1><p class="sensitive-note">Mobile and Aadhaar are compulsory. Aadhaar is retained only as a uniqueness fingerprint and masked last four digits; it is never shown in full after save.</p><form data-onboarding-form class="form-grid"><label class="field">Full Name<input name="full_name" maxlength="160" required></label><label class="field">Mobile<input name="mobile" inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10" required></label><label class="field">Aadhaar Number<input name="aadhaar" inputmode="numeric" pattern="[0-9]{12}" maxlength="12" autocomplete="off" required></label><label class="field">Date of Birth<input name="date_of_birth" type="date" required></label><label class="field">Gender<select name="gender" required><option value="">Select</option><option>Male</option><option>Female</option><option>Other / Prefer not to say</option></select></label><label class="field">Candidate Type<select name="candidate_type" required><option>Fresher</option><option>Experienced</option></select></label><label class="field">Current City / Village<input name="current_location" required></label><label class="field">District<input name="district" required></label><label class="field">State<input name="state" required></label><label class="field">Pincode<input name="pincode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"></label><label class="field">Qualification<select name="highest_qualification" required><option>Below 10th</option><option>10th</option><option>12th</option><option>ITI</option><option>Diploma</option><option>Graduate</option><option>Post Graduate</option><option>Other</option></select></label><label class="field">Trade / Specialization<input name="specialization"></label><label class="field field-wide"><input name="consent" type="checkbox" required> I consent to Candidate profile processing under the Privacy Policy.</label><button class="button" type="submit">Save Required Profile</button></form><p data-message class="message" role="status"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4" integrity="sha384-ysv13JVP3fufiEXfjML9OdCa/rRbMJvUBOWyor82wfuK8INNZAvmbxHgKIHi+oqz" crossorigin="anonymous"></script><script src="../../config.js"></script><script src="../../supabase-client.js"></script><script src="candidate.js"></script></body></html>
