<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Candidate Account Registration | Aadhyant</title>
  <link rel="stylesheet" href="candidate.css">
</head>
<body data-candidate-page="register">
  <main class="auth-page">
    <section class="auth-card">
      <p class="eyebrow">Candidate Portal · Step 1 of 2</p>
      <h1>Create Candidate Account</h1>
      <p>Create your private login. Next, add your core profile details so you can review suitable opportunities without repeating basic information.</p>
      <form data-register-form class="form-grid">
        <label class="field field-wide">Email <span aria-hidden="true">*</span><input name="email" type="email" autocomplete="email" required></label>
        <label class="field field-wide">Password <span aria-hidden="true">*</span><input name="password" type="password" minlength="10" autocomplete="new-password" required></label>
        <button class="button" type="submit">Continue to Profile</button>
      </form>
      <p data-message class="message" role="status"></p>
      <a href="login.html">Return to login</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4" integrity="sha384-yiVMs0R/Jyz7OhoXa/DsEMUSBLjEhr/QJta2ONO+zB6I8/GmNg/7AUFrZmAJV7KV" crossorigin="anonymous"></script>
  <script src="../../config.js"></script>
  <script src="../../supabase-client.js"></script>
  <script src="candidate.js"></script>
</body>
</html>
