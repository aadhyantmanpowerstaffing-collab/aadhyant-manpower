<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Profile | Candidate Portal</title><link rel="stylesheet" href="candidate.css"></head><body data-candidate-page="profile"><p data-loading>Checking Candidate access…</p><div class="shell" data-portal hidden><aside class="sidebar"><div class="brand">AADHYANT · Candidate</div><nav><a href="index.html">Dashboard</a><a aria-current="page" href="profile.html">My Profile</a><a href="jobs.html">Job Opportunities</a><a href="applications.html">My Applications</a><a href="interviews.html">Interviews</a><a href="joinings.html">Joining Status</a><a href="documents.html">Documents</a><button data-logout>Logout</button></nav></aside><main class="main"><h1>My Profile</h1><p class="sensitive-note">Aadhaar is never displayed in full. Re-enter all 12 digits only when saving a profile update.</p><form data-profile-form class="panel form-grid"><label class="field">Full Name<input name="full_name" maxlength="160" required></label><label class="field">Mobile<input name="mobile" inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10" required></label><label class="field">Saved Aadhaar<input name="aadhaar_masked" disabled></label><label class="field">Re-enter Aadhaar to Save<input name="aadhaar" inputmode="numeric" pattern="[0-9]{12}" maxlength="12" autocomplete="off" required></label><label class="field">Date of Birth<input name="date_of_birth" type="date" required></label><label class="field">Gender<select name="gender" required><option>Male</option><option>Female</option><option>Other / Prefer not to say</option></select></label><label class="field">Current City / Village<input name="current_location" required></label><label class="field">District<input name="district" required></label><label class="field">State<input name="state" required></label><label class="field">Pincode<input name="pincode" pattern="[0-9]{6}" maxlength="6"></label><label class="field">Qualification<select name="highest_qualification"><option>Below 10th</option><option>10th</option><option>12th</option><option>ITI</option><option>Diploma</option><option>Graduate</option><option>Post Graduate</option><option>Other</option></select></label><label class="field">Trade / Specialization<input name="specialization"></label><label class="field">Candidate Type<select name="candidate_type"><option>Fresher</option><option>Experienced</option></select></label><label class="field">Total Experience<input name="total_experience"></label><label class="field">Previous Role<input name="previous_job_role"></label><label class="field">Interview Available<select name="interview_available"><option>Yes</option><option>No</option></select></label><label class="field">Preferred Locations<input name="preferred_locations" placeholder="Comma-separated"></label><label class="field">Preferred Roles<input name="preferred_job_roles" placeholder="Comma-separated"></label><label class="field">Expected Salary Minimum<input name="expected_salary_min" type="number" min="0"></label><label class="field">Expected Salary Maximum<input name="expected_salary_max" type="number" min="0"></label><label class="field">Preferred Shift<input name="preferred_shift"></label><label class="field">Joining Availability<input name="joining_availability_date" type="date"></label><label class="field field-wide"><input name="immediate_joining" type="checkbox"> Available for immediate joining</label><button class="button" type="submit">Save Profile</button></form><p data-message class="message" role="status"></p></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4" integrity="sha384-ysv13JVP3fufiEXfjML9OdCa/rRbMJvUBOWyor82wfuK8INNZAvmbxHgKIHi+oqz" crossorigin="anonymous"></script><script src="../../config.js"></script><script src="../../supabase-client.js"></script><script src="candidate.js"></script></body></html>
